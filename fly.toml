# fly.toml app configuration file generated for tlarevo-blog on 2026-06-14T22:41:54+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tlarevo-blog'
primary_region = 'cdg'
kill_signal = 'SIGTERM'

[build]

[env]
  PHX_HOST = 'tlarevo.me'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 1000
  [http_service.checks]
    [http_service.checks.health]
      interval = "10s"
      timeout = "2s"
      method = "GET"
      path = "/health"

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
